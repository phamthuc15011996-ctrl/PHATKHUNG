<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHATKHUNG</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#30467e,#0b1327 55%,#050914);font-family:Arial;color:#fff;display:grid;place-items:center}.box{width:min(980px,94vw);padding:25px;text-align:center;background:#ffffff0d;border:1px solid #ffffff22;border-radius:28px;box-shadow:0 20px 70px #0008}h1{font-size:clamp(35px,7vw,62px);color:#ffd75e;margin:0}.join,.ctrl{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:18px}input,button{border:0;border-radius:12px;padding:14px 18px;font-size:17px}button{font-weight:800;cursor:pointer}.green{background:#5fe0a0}.gold{background:#ffd75e}.red{background:#ff7777;color:#fff}.players{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.p{background:#ffffff17;padding:8px 13px;border-radius:20px}.count{height:125px;display:grid;place-items:center;font-size:90px;font-weight:900;color:#ffd75e}.machine{display:flex;gap:14px;justify-content:center}.n{width:min(26vw,170px);height:min(32vw,210px);background:#fff;color:#111a30;border-radius:22px;display:grid;place-items:center;font-size:min(21vw,140px);font-weight:900;box-shadow:inset 0 0 0 8px #cbd2df,0 14px 30px #0008}.spin{animation:j .07s infinite alternate}@keyframes j{to{transform:translateY(5px)}}#results{margin-top:20px;font-size:19px}#results b{color:#ffd75e;font-size:28px}.small{opacity:.55;font-size:12px}</style></head><body><main class="box"><h1>🎰 PHATKHUNG</h1><div>BỐC SỐ ONLINE • 3 SỐ MAY MẮN</div><div class="join"><input id="name" placeholder="Nhập tên của bạn"><button class="green" onclick="join()">THAM GIA</button></div><div id="players" class="players"></div><div id="count" class="count">SẴN SÀNG</div><div class="machine"><div id="a" class="n">0</div><div id="b" class="n">0</div><div id="c" class="n">0</div></div><div id="results"></div><div class="ctrl"><button class="gold" onclick="post('/start')">▶ BẮT ĐẦU</button><button onclick="post('/reset')">↻ VÒNG MỚI</button><button class="red" onclick="post('/clear')">XÓA NGƯỜI CHƠI</button></div><div class="small">Mọi người có Internet đều có thể tham gia bằng cùng một đường link.</div></main><script>
let timer,old="";const post=(u,d={})=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
function join(){let n=name.value.trim();if(n){localStorage.pk=n;post("/join",{name:n});name.value=""}}name.onkeydown=e=>e.key==="Enter"&&join();
new EventSource("/events").onmessage=e=>{let d=JSON.parse(e.data),s=d.state;players.innerHTML=d.players.map(x=>`<span class=p>👤 ${x}</span>`).join("");
if(s.phase!==old){if(s.phase==="spin"){[a,b,c].forEach(x=>x.classList.add("spin"));timer=setInterval(()=>[a,b,c].forEach(x=>x.textContent=Math.floor(Math.random()*10)),55)}if(s.phase==="result"){clearInterval(timer);[a,b,c].forEach(x=>x.classList.remove("spin"))}old=s.phase}
if(s.phase==="lobby"){count.textContent="SẴN SÀNG";results.innerHTML="";a.textContent=b.textContent=c.textContent="0"}if(s.phase==="countdown")count.textContent=s.count;if(s.phase==="spin"){count.textContent="QUAY!";results.innerHTML=""}if(s.phase==="result"){count.textContent="KẾT QUẢ";let me=localStorage.pk||"",v=s.results[me]||Object.values(s.results)[0]||"000";a.textContent=v[0];b.textContent=v[1];c.textContent=v[2];results.innerHTML=Object.entries(s.results).map(([n,v])=>`<div>${n===me?"⭐ ":""}${n}: <b>${v}</b></div>`).join("")}};
</script></body></html>
