<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHATKHUNG - Bốc số</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f5fb;font-family:Arial,sans-serif;color:#172033}.app{max-width:1100px;margin:auto;padding:22px 14px}h1{text-align:center;margin:5px 0;color:#263a70}.sub{text-align:center;color:#667085;margin-bottom:20px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 30px #25345b18}.join{display:flex;gap:8px;margin-bottom:18px}.join input{flex:1;min-width:0;padding:13px;border:1px solid #cfd6e4;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:12px 17px;font-weight:800;cursor:pointer}.join button{background:#263a70;color:white}.status{text-align:center;min-height:70px;display:grid;place-items:center;font-weight:900;font-size:44px;color:#e6a900}.status.small{font-size:20px;color:#667085}table{width:100%;border-collapse:collapse;margin-top:5px}th,td{border:1px solid #b9c1cf;padding:12px;text-align:left}th{background:#eef2f8;font-size:15px}th:last-child,td:last-child{width:145px;text-align:center}.number{font-size:27px;font-weight:900;color:#172e67;letter-spacing:5px}.rolling{color:#e6a900}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.start{background:#f4c542}.reset{background:#e8edf5}.clear{background:#ef6b6b;color:white}.note{text-align:center;color:#8a93a3;font-size:12px;margin-top:14px}.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}.chat-panel{border:1px solid #dce2ec;border-radius:14px;overflow:hidden;background:#fafbfe}.chat-title{padding:12px 14px;background:#263a70;color:white;font-weight:900}.chat-messages{height:360px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}.chat-empty{text-align:center;color:#98a2b3;margin:auto}.chat-msg{background:white;border:1px solid #e1e6ef;border-radius:10px;padding:8px 10px;word-break:break-word}.chat-meta{font-size:12px;color:#7b8495;margin-bottom:3px}.chat-name{font-weight:900;color:#263a70}.chat-send{display:flex;gap:7px;padding:10px;border-top:1px solid #e1e6ef;background:white}.chat-send input{flex:1;min-width:0;padding:11px;border:1px solid #cfd6e4;border-radius:9px}.chat-send button{background:#263a70;color:white;padding:10px 13px}@media(max-width:800px){.main-grid{grid-template-columns:1fr}.chat-messages{height:280px}}@media(max-width:500px){th,td{padding:10px 8px}th:last-child,td:last-child{width:105px}.number{font-size:23px}.status{font-size:38px}}.joined-only{display:none}</style></head>
<body><div class="app"><h1>🎰 PHATKHUNG</h1><div class="sub">BỐC SỐ ONLINE</div><div class="card"><div class="main-grid"><div>
<div id="joinBox" class="join"><input id="name" placeholder="Nhập tên người chơi"><button onclick="join()">THAM GIA</button></div><div id="meInfo" style="display:none;text-align:center;margin-bottom:12px;font-weight:800;color:#263a70"></div>
<div id="status" class="status small joined-only">CHỜ NGƯỜI CHƠI THAM GIA</div>
<table class="joined-only"><thead><tr><th>DANH SÁCH NGƯỜI CHƠI</th><th>SỐ</th></tr></thead><tbody id="rows"><tr><td colspan="2" style="text-align:center;color:#8a93a3">Chưa có người chơi</td></tr></tbody></table>
<div id="hostControls" class="controls joined-only" style="display:none"><button class="start" onclick="hostPost('/start')">▶ BẮT ĐẦU</button><button class="reset" onclick="hostPost('/reset')">↻ VÒNG MỚI</button><button class="clear" onclick="hostPost('/clear')">XÓA DANH SÁCH</button></div>
<div class="note joined-only">Khi bắt đầu, tất cả thiết bị cùng đếm 5 → 4 → 3 → 2 → 1 và xem chung toàn bộ kết quả.</div></div><div class="chat-panel joined-only"><div class="chat-title">💬 CHAT PHÒNG</div><div id="chatMessages" class="chat-messages"><div class="chat-empty">Chưa có tin nhắn</div></div><div class="chat-send"><input id="chatInput" maxlength="200" placeholder="Nhập tin nhắn..."><button onclick="sendChat()">GỬI</button></div></div></div></div></div>
<script>
let data={players:[],state:{phase:"lobby",results:{}},messages:[],host:null},roll=null;
const post=(u,d={})=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
function join(){
 const nameInput=document.getElementById("name");
 const n=(nameInput?.value || "").trim();
 if(!n)return;
 localStorage.setItem("pk",n);
 post("/join",{name:n}).catch(console.error);
 nameInput.value="";
}
document.getElementById("name").addEventListener("keydown",e=>{if(e.key==="Enter")join()});
function hostPost(u){let me=(localStorage.getItem("pk")||"").trim();if(me)post(u,{name:me})}
function updateRoleUI(){let me=(localStorage.getItem("pk")||"").trim(),joined=!!me&&data.players.includes(me);document.querySelectorAll(".joined-only").forEach(el=>{
 if(!joined){el.style.display="none";return}
 if(el.tagName==="TABLE")el.style.display="table";
 else if(el.id==="hostControls")el.style.display=(me===data.host)?"flex":"none";
 else if(el.id==="status")el.style.display="grid";
 else el.style.display="block";
});joinBox.style.display=joined?"none":"flex";meInfo.style.display=joined?"block":"none";if(joined)meInfo.textContent=me===data.host?`👑 ${me} — CHỦ PHÒNG`:`👤 ${me} — ĐÃ THAM GIA`;hostControls.style.display=(joined&&me===data.host)?"flex":"none"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function drawChat(){let b=document.getElementById("chatMessages"),m=data.messages||[];b.innerHTML=m.length?m.map(x=>`<div class="chat-msg"><div class="chat-meta"><span class="chat-name">${esc(x.name)}</span> • ${esc(x.time||"")}</div><div>${esc(x.text)}</div></div>`).join(""):'<div class="chat-empty">Chưa có tin nhắn</div>';b.scrollTop=b.scrollHeight}
function sendChat(){let i=document.getElementById("chatInput"),me=(localStorage.getItem("pk")||"").trim(),t=i.value.trim();if(!me||!data.players.includes(me)){alert("Bạn cần THAM GIA trước khi chat.");return}if(t){post("/chat",{name:me,text:t});i.value=""}}
document.getElementById("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});
function draw(random=false){
 const rows=document.getElementById("rows");
 if(!data.players.length){rows.innerHTML='<tr><td colspan="2" style="text-align:center;color:#8a93a3">Chưa có người chơi</td></tr>';return}
 rows.innerHTML=data.players.map(p=>{let v="";
   if(random)v=String(Math.floor(Math.random()*1000)).padStart(3,"0");
   else if(data.state.phase==="result")v=data.state.results[p]||"";
   return `<tr><td>${p===data.host?"👑":"👤"} ${p}${p===data.host?" <b>(Chủ phòng)</b>":""}</td><td class="number ${random?'rolling':''}">${v}</td></tr>`}).join("")
}
new EventSource("/events").onmessage=e=>{
 data=JSON.parse(e.data);let s=data.state;clearInterval(roll);
 const status=document.getElementById("status");updateRoleUI();drawChat();
 if(s.phase==="lobby"){status.className="status small joined-only";status.style.display="grid";status.textContent="CHỜ CHỦ PHÒNG BẮT ĐẦU";draw()}
 if(s.phase==="countdown"){status.className="status joined-only";status.style.display="grid";status.textContent=s.count;draw()}
 if(s.phase==="spin"){status.className="status joined-only";status.style.display="grid";status.textContent="ĐANG QUAY...";draw(true);roll=setInterval(()=>draw(true),70)}
 if(s.phase==="result"){status.className="status small joined-only";status.style.display="grid";status.textContent="🎉 KẾT QUẢ";draw()}
};
</script></body></html>
